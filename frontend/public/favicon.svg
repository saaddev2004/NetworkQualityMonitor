<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101B2D"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" floodColor="#48D9C2" floodOpacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#48D9C2" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Scaled Centered Pulse Waveform -->
  <g transform="translate(0, 8)">
    <path 
      d="M 8 24 L 18 24 L 23 29 L 30 11 L 39 37 L 46 20 L 50 24 L 56 24" 
      fill="none" 
      stroke="#48D9C2" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Left Node -->
    <circle cx="8" cy="24" r="4.5" fill="#48D9C2" filter="url(#nodeGlow)"/>
    <circle cx="8" cy="24" r="2" fill="#FFFFFF"/>

    <!-- Right Node -->
    <circle cx="56" cy="24" r="4.5" fill="#48D9C2" filter="url(#nodeGlow)"/>
    <circle cx="56" cy="24" r="2" fill="#FFFFFF"/>
  </g>
</svg>
